<!DOCTYPE html>
<html lang="de">
<head>
<link rel="shortcut icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fehler</title>
    <style>
		.button {
			background-color: #04AA6D;
			border: none;
			color: white;
			padding: 15px 32px;
			text-align: center;
			text-decoration: none;
			display: inline-block;
			font-size: 16px;
			margin: 4px 2px;
			cursor: pointer;
		}
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .container {
        	position: relative;
            display: flex;
            align-items: center;
            max-width: 800px;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 2rem;
            height: 350px;
        }
        .container a{
			position: absolute;
			bottom: 2rem;
			right: 2rem;
			color: #fff;
			background-color: #003063;
			border-radius: 0.25rem;
			padding: 0.5rem 0.5rem;
			cursor: pointer;
			text-decoration:none
		}
        .image-container {
            border-radius: 2rem;
            height: 352px;
            width: 369px;
            padding-right: 1.5rem;
        }
        .image-container img {
            height: 100%;
            border-radius: 1rem 0 0 1rem;
        }
        .text-container {
            flex: 1;
            margin-right: 2rem
        }
        .text-container p {
            margin: 0 2rem 0 0;
            line-height: 1.5;
        }
    </style>
    <script type="text/javascript">
        let saetze = ["Die IT ohne Fehler ist wie Hamburg ohne Regen - unvorstellbar und irgendwie nicht authentisch.",
        "Die IT ohne Fehler wäre wie ein Hamburger ohne Senf - es mag sauberer aussehen, aber es fehlt definitiv etwas an Charakter.",
        "Wenn die IT eine Hafenstadt wäre, wären Fehler die Gezeiten - unvermeidlich",
        "Fehler in der IT sind wie Hamburger Verkehrsstaus: Du kannst sie nicht immer vermeiden",
        "In der IT gibt es zwei Arten von Menschen: Diejenigen, die Fehler machen, und diejenigen, die sie so gut verstecken, dass sie sich fühlen wie die versteckten Ecken in Hamburgs Gassen.",
        "Die Kunst in der IT besteht darin, Fehler so zu machen, dass sie wie geplante Features aussehen. Eine Fähigkeit, die in Hamburg auch beim Wetter geschätzt wird.",
        "Manche Fehler sind so hartnäckig, dass sie sich fühlen, als wären sie im Hamburger Nebel verloren gegangen - sie verschwinden nie ganz.",
        "Wenn Hamburg ein Fehler wäre, wäre es vermutlich der charmanteste Bug in unserem System.",
        "In der IT ist jeder Fehler nur eine Gelegenheit, den nächsten Patch herauszubringen. Ganz wie das Hamburger Wetter - immer Raum für Verbesserungen."
        ];

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }


        window.onload = (event) => {
            let container = document.querySelector(".text-container p");
            if (container) {
                container.innerHTML  = saetze[getRandomInt(saetze.length - 1)]; 
            }
            console.log('The page has fully loaded');
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="image-container">
            <img src="error.jpg" alt="Fehlerseite">
        </div>
        <div class="text-container">
            <p>
            </p>
            <a href="https://hamburg.de">zurück</a>
        </div>
    </div>
</body>
</html>
